[workspace]
resolver = "2"
members = [
    "crypto",
    "pallets/pallet-pq-dilithium",
    "pallets/pallet-pq-balances",
    "pallets/pallet-pq-staking",
    "runtime",
    "node",
    "stubs/substrate-prometheus-endpoint",
    "stubs/sc-network",
    "stubs/getrandom-03",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
polkadot-sdk = { git = "https://github.com/paritytech/polkadot-sdk.git", default-features = false }
codec = { package = "parity-scale-codec", version = "3", default-features = false }
scale-info = { version = "2", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[patch."https://github.com/paritytech/polkadot-sdk.git"]
substrate-prometheus-endpoint = { path = "./stubs/substrate-prometheus-endpoint" }
sc-network = { path = "./stubs/sc-network" }

# getrandom stub ONLY for wasm32 — native uses real getrandom with entropy
# (wasm32 target currently commented out in crypto/Cargo.toml; re-enable when needed)
# [patch.crates-io]
# getrandom = { path = "./stubs/getrandom-03" }
